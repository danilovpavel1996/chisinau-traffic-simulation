<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d232b; --muted: #6b7480; --line: #e3e6ea;
    --truth: #3fa34d; --match: #e2433f; --dr: #7b4fb8; --stop: #f0a020; --turn: #2e86ab; --crossing: #c13fd1;
    --moving: #9fd4a3; --stopped: #f2b8b5; --red: #d63a35;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151a; --panel: #1b2027; --text: #e6e9ee; --muted: #9aa3ae; --line: #2c333c;
      --moving: #2f6b3a; --stopped: #7a3330;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  header .sub { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 12px; padding: 12px 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .videowrap { position: relative; background: #000; }
  video { display: block; width: 100%; max-height: 62vh; }
  canvas#overlay { position: absolute; left: 0; top: 0; pointer-events: none; }
  #map { height: 100%; min-height: 420px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
  .stat { padding: 8px 12px; border-right: 1px solid var(--line); }
  .stat:last-child { border-right: 0; }
  .stat .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .stat .v { font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .controls { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  .controls label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .bottom { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; }
  #timeline { width: 100%; height: 64px; display: block; cursor: pointer; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 6px 12px 8px; color: var(--muted); font-size: 12px; }
  .sw { display: inline-block; width: 12px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
  #events { max-height: 140px; overflow: auto; font-size: 13px; }
  #events div { padding: 4px 12px; cursor: pointer; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  #events div:hover, #events div.now { background: color-mix(in srgb, var(--turn) 12%, transparent); }
  #events .t { color: var(--muted); font-variant-numeric: tabular-nums; width: 62px; flex: none; }
  .acc { padding: 8px 12px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
  @media (max-width: 900px) { main, .bottom { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header><h1 id="title">Drive</h1><span class="sub" id="subtitle"></span></header>
<main>
  <section class="card">
    <div class="videowrap"><video id="video" controls playsinline></video><canvas id="overlay"></canvas></div>
    <div class="stats">
      <div class="stat"><div class="k">Clock</div><div class="v" id="clock">–</div></div>
      <div class="stat"><div class="k">Street (matched)</div><div class="v" id="street">–</div></div>
      <div class="stat"><div class="k">Speed (est.)</div><div class="v" id="speed">–</div></div>
      <div class="stat"><div class="k">Off true route</div><div class="v" id="err">–</div></div>
    </div>
    <div class="controls">
      <label><input type="checkbox" id="showBoxes" checked> detection boxes</label>
      <label><input type="checkbox" id="follow" checked> map follows car</label>
      <label><input type="checkbox" id="showTruth" checked> true route</label>
      <label><input type="checkbox" id="showDR"> video-only shape</label>
      <span>Space play/pause · ←/→ 5 s</span>
    </div>
  </section>
  <section class="card"><div id="map"></div></section>
  <div class="bottom">
    <section class="card">
      <canvas id="timeline"></canvas>
      <div class="legend">
        <span><span class="sw" style="background:var(--moving)"></span>moving</span>
        <span><span class="sw" style="background:var(--stopped)"></span>stopped</span>
        <span><span class="sw" style="background:var(--turn)"></span>turning</span>
        <span><span class="sw" style="background:var(--red)"></span>red light seen</span>
        <span><span class="sw" style="background:var(--muted);opacity:.35"></span>outside street window</span>
      </div>
      <div class="acc" id="acc"></div>
    </section>
    <section class="card"><div id="events"></div></section>
  </div>
</main>
<script>
const D = /*__DATA__*/null;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);
const M = D.match, T = M.trace;
const start = new Date(M.start_time);
const fmtClock = s => new Date(start.getTime() + s * 1000).toTimeString().slice(0, 8);

$("title").textContent = start.toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
document.title = "Drive · " + $("title").textContent;
$("subtitle").textContent = D.description + (D.truth_route ? " · true route: " + D.truth_route : "");
if (M.accuracy) {
  const a = M.accuracy;
  $("acc").textContent = `Match vs true route — median ${a.median_m} m, 90th pct ${a.p90_m} m, within 30 m ${a.within_30m} of the time, `
    + `covers ${a.coverage} of the route · ${M.km} km matched · ${M.method}, seed ${M.seed} (picked by evidence, not by the truth)`;
}

// ── video ──
const video = $("video");
video.src = D.video;

// ── map ──
const map = L.map("map", { zoomControl: true });
const streets = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
  { attribution: "© Esri, OpenStreetMap contributors", maxZoom: 19 }).addTo(map);
const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { attribution: "© Esri", maxZoom: 19 });
L.control.layers({ Streets: streets, Satellite: sat }).addTo(map);

const pts = T.lat.map((la, i) => [la, T.lon[i]]);
const truth = M.truth ? L.polyline(M.truth, { color: css("--truth"), weight: 9, opacity: .45 }).addTo(map) : null;
const dr = L.polyline(M.dead_reckoning, { color: css("--dr"), weight: 2, dashArray: "6 6" });
const full = L.polyline(pts, { color: css("--match"), weight: 3, opacity: .25 }).addTo(map);
const done = L.polyline([], { color: css("--match"), weight: 5 }).addTo(map);
L.marker(M.anchor, { title: "start (GPS)" }).addTo(map).bindTooltip("start · " + fmtClock(0) + " (GPS)");
const car = L.marker(pts[0], { icon: L.divIcon({ className: "", iconSize: [26, 26], iconAnchor: [13, 13],
  html: `<svg id="carsvg" width="26" height="26" viewBox="-13 -13 26 26"><circle r="11" fill="${css("--match")}" stroke="#fff" stroke-width="2"/>`
      + `<path d="M0,-7 L5,4 L0,1 L-5,4 Z" fill="#fff"/></svg>` }), zIndexOffset: 1000 }).addTo(map);
map.fitBounds((truth || full).getBounds(), { padding: [20, 20] });

// stops & turns on the map (at the matched position at that time)
const idxAt = s => { const i = Math.floor(s) - T.video_s[0]; return i < 0 || i >= T.video_s.length ? -1 : i; };
for (const ev of D.events) {
  const i = idxAt(ev.t); if (i < 0) continue;
  L.circleMarker(pts[i], { radius: ev.kind === "stop" ? 6 : 4, color: css("--" + ev.kind),
    fillOpacity: .9, weight: 1 }).addTo(map).bindTooltip(fmtClock(ev.t) + " · " + ev.text).on("click", () => seek(ev.t));
}
full.on("click", e => {                                // click route → jump video
  let best = 0, bd = Infinity;
  pts.forEach((p, i) => { const d = map.distance(p, e.latlng); if (d < bd) { bd = d; best = i; } });
  seek(T.video_s[best]);
});
$("showTruth").onchange = e => truth && (e.target.checked ? truth.addTo(map) : truth.remove());
$("showDR").onchange = e => e.target.checked ? dr.addTo(map) : dr.remove();

// ── events list ──
const evBox = $("events");
D.events.forEach(ev => {
  const row = document.createElement("div");
  row.innerHTML = `<span class="t">${fmtClock(ev.t)}</span><span style="color:${css("--" + ev.kind)}">●</span><span>${ev.text}</span>`;
  row.onclick = () => seek(ev.t); ev.row = row; evBox.appendChild(row);
});

// ── timeline ──
const tl = $("timeline"), tctx = tl.getContext("2d");
function drawTimeline(t) {
  const w = tl.clientWidth, h = tl.clientHeight, dpr = devicePixelRatio || 1;
  if (tl.width !== w * dpr) { tl.width = w * dpr; tl.height = h * dpr; }
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0); tctx.clearRect(0, 0, w, h);
  const S = D.states, dur = D.duration, x = s => s / dur * w;
  const [w0, w1] = M.street_window_s;
  S.s.forEach((s, i) => {
    tctx.fillStyle = S.moving[i] ? css("--moving") : css("--stopped"); tctx.fillRect(x(s), 8, Math.max(1, x(1)), 22);
    if (S.turning[i]) { tctx.fillStyle = css("--turn"); tctx.fillRect(x(s), 32, Math.max(1, x(1)), 8); }
    if (S.red[i]) { tctx.fillStyle = css("--red"); tctx.fillRect(x(s), 42, Math.max(1, x(1)), 8); }
  });
  tctx.fillStyle = css("--muted"); tctx.globalAlpha = .35;
  tctx.fillRect(0, 8, x(w0), 42); tctx.fillRect(x(w1), 8, w - x(w1), 42); tctx.globalAlpha = 1;
  tctx.fillStyle = css("--muted"); tctx.font = "11px sans-serif";
  for (let m = 0; m * 60 <= dur; m++) tctx.fillText(fmtClock(m * 60).slice(0, 5), x(m * 60) + 2, 62);
  tctx.fillStyle = css("--text"); tctx.fillRect(x(t) - 1, 2, 2, 52);
}
tl.onclick = e => seek(e.offsetX / tl.clientWidth * D.duration);

// ── detection overlay ──
const ov = $("overlay"), octx = ov.getContext("2d");
const detT = D.detections.map(f => f[0]);
const boxColor = { car: "#4fc3f7", heavy: "#ffb74d", motorcycle: "#ce93d8", light: "#ffffff" };
const lightColor = { red: "#ff3b30", yellow: "#ffcc00", green: "#34c759" };
function drawOverlay(t) {
  const r = video.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (ov.width !== r.width * dpr || ov.height !== r.height * dpr) {   // backing store at device pixels,
    ov.width = r.width * dpr; ov.height = r.height * dpr;              // displayed at CSS pixels (else 2× on Retina)
    ov.style.width = r.width + "px"; ov.style.height = r.height + "px";
  }
  octx.setTransform(dpr, 0, 0, dpr, 0, 0); octx.clearRect(0, 0, r.width, r.height);
  if (!$("showBoxes").checked || !detT.length) return;
  let lo = 0, hi = detT.length - 1;                      // last frame at or before t
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (detT[m] <= t) lo = m; else hi = m - 1; }
  if (Math.abs(detT[lo] - t) > 0.4) return;
  const [W, H] = D.src_size, sc = Math.min(r.width / W, r.height / H), ox = (r.width - W * sc) / 2, oy = (r.height - H * sc) / 2;
  octx.lineWidth = 2; octx.font = "11px sans-serif";
  for (const [x1, y1, x2, y2, cls, light] of D.detections[lo][1]) {
    const c = cls === "light" ? (lightColor[light] || boxColor.light) : boxColor[cls];
    octx.strokeStyle = c; octx.strokeRect(ox + x1 * sc, oy + y1 * sc, (x2 - x1) * sc, (y2 - y1) * sc);
  }
}

// ── sync loop ──
function seek(s) { video.currentTime = Math.max(0, Math.min(s, D.duration)); if (video.paused) update(); }
let lastIdx = -2;
function update() {
  const t = video.currentTime, i = idxAt(t);
  $("clock").textContent = fmtClock(t);
  if (i >= 0) {
    if (i !== lastIdx) {
      done.setLatLngs(pts.slice(0, i + 1));
      car.setLatLng(pts[i]);
      const svg = document.getElementById("carsvg"); if (svg) svg.style.transform = `rotate(${T.bearing[i]}deg)`;
      $("street").textContent = T.street[i]; $("street").title = T.street[i];
      $("speed").textContent = T.speed_kmh[i] + " km/h";
      $("err").textContent = T.error_m ? Math.round(T.error_m[i]) + " m" : "–";
      if ($("follow").checked && !map.getBounds().pad(-0.25).contains(pts[i])) map.panTo(pts[i], { animate: true });
      lastIdx = i;
    }
  } else if (lastIdx !== -1) {
    $("street").textContent = t < M.street_window_s[0] ? "(not yet on the street)" : "(parking at destination)";
    $("speed").textContent = "–"; $("err").textContent = "–"; lastIdx = -1;
  }
  let cur = null; for (const ev of D.events) { if (ev.t <= t) cur = ev; ev.row.classList.remove("now"); }
  if (cur) cur.row.classList.add("now");
  drawTimeline(t); drawOverlay(t);
}
(function loop() { update(); requestAnimationFrame(loop); })();
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); video.paused ? video.play() : video.pause(); }
  if (e.code === "ArrowRight") seek(video.currentTime + 5);
  if (e.code === "ArrowLeft") seek(video.currentTime - 5);
});
</script>
</body>
</html>
